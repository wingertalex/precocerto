<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#111110">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Preço Certo">
<title>Preço Certo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #111110; --bg2: #1a1a18; --bg3: #242422; --bg4: #2e2e2b;
    --border: rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.14);
    --text: #f0ede6; --text2: #9e9b93; --text3: #6b6862;
    --green: #97C459; --green-bg: rgba(151,196,89,0.12); --green-dim: #639922;
    --red: #E24B4A; --red-bg: rgba(226,75,74,0.12);
    --amber: #EF9F27; --amber-bg: rgba(239,159,39,0.12);
    --radius: 12px; --radius-sm: 8px;
    --sans: 'Syne', system-ui, sans-serif;
    --mono: 'DM Mono', monospace;
  }
  html { background: var(--bg); }
  body { font-family: var(--sans); background: var(--bg); color: var(--text); min-height: 100dvh; overflow-x: hidden; }

  /* ── Login ── */
  #screen-login {
    min-height: 100dvh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 32px 24px;
  }
  .login-logo { font-size: 48px; margin-bottom: 16px; }
  .login-title { font-size: 26px; font-weight: 600; letter-spacing: -0.03em; margin-bottom: 6px; }
  .login-sub { font-size: 14px; color: var(--text3); margin-bottom: 36px; }
  .login-box { width: 100%; max-width: 340px; }
  .login-label { font-family: var(--mono); font-size: 11px; color: var(--text3); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px; display: block; }
  .login-input {
    width: 100%; padding: 14px 16px; background: var(--bg3);
    border: 1px solid var(--border2); border-radius: var(--radius-sm);
    font-size: 18px; color: var(--text); font-family: var(--sans);
    letter-spacing: 0.1em; outline: none; text-align: center;
    transition: border-color 0.15s;
  }
  .login-input:focus { border-color: var(--green); }
  .login-btn {
    width: 100%; padding: 14px; margin-top: 12px;
    background: var(--green); color: #111; border: none;
    border-radius: var(--radius-sm); font-size: 16px; font-weight: 600;
    font-family: var(--sans); cursor: pointer; transition: opacity 0.15s;
  }
  .login-btn:active { opacity: 0.85; }
  .login-error { margin-top: 10px; font-size: 13px; color: var(--red); text-align: center; min-height: 20px; }
  .login-hint { margin-top: 20px; font-size: 12px; color: var(--text3); text-align: center; line-height: 1.6; }

  /* ── App ── */
  #screen-app { display: none; }
  .header {
    padding: 52px 20px 14px; border-bottom: 1px solid var(--border);
    background: var(--bg); position: sticky; top: 0; z-index: 10;
  }
  .header-inner { display: flex; align-items: center; justify-content: space-between; }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-icon { width: 34px; height: 34px; background: var(--green); border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 17px; }
  .logo-text { font-size: 19px; font-weight: 600; letter-spacing: -0.02em; }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
  .sync-dot.off { background: var(--text3); }
  .sync-dot.syncing { background: var(--amber); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .logout-btn { font-family: var(--mono); font-size: 11px; color: var(--text3); background: none; border: 1px solid var(--border); border-radius: 20px; padding: 4px 10px; cursor: pointer; }

  .tabs { display: flex; background: var(--bg); border-bottom: 1px solid var(--border); padding: 0 20px; gap: 4px; }
  .tab { flex: 1; padding: 11px 0; font-size: 13px; font-weight: 500; font-family: var(--sans); border: none; background: none; cursor: pointer; color: var(--text3); border-bottom: 2px solid transparent; transition: all 0.15s; }
  .tab.active { color: var(--text); border-bottom-color: var(--green); }

  .view { display: none; padding: 20px; padding-bottom: 48px; }
  .view.active { display: block; }

  /* ── Form ── */
  .flabel { display: block; font-family: var(--mono); font-size: 11px; color: var(--text3); margin-bottom: 6px; letter-spacing: 0.06em; text-transform: uppercase; }
  .fgroup { margin-bottom: 14px; }
  input, select {
    width: 100%; padding: 11px 14px; background: var(--bg3);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    font-size: 15px; color: var(--text); font-family: var(--sans);
    outline: none; transition: border-color 0.15s; -webkit-appearance: none;
  }
  input:focus, select:focus { border-color: var(--border2); }
  input::placeholder { color: var(--text3); }
  select option { background: var(--bg3); color: var(--text); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .btn-save {
    width: 100%; padding: 13px; background: var(--green); color: #111;
    border: none; border-radius: var(--radius-sm); font-size: 15px;
    font-weight: 600; font-family: var(--sans); cursor: pointer; margin-top: 4px;
    transition: opacity 0.15s, transform 0.1s;
  }
  .btn-save:active { transform: scale(0.99); opacity: 0.9; }
  .btn-save:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ── Who label ── */
  .who-chip {
    display: inline-block; font-family: var(--mono); font-size: 11px;
    padding: 3px 9px; border-radius: 20px; margin-right: 6px; margin-bottom: 4px;
    border: 1px solid var(--border); background: var(--bg3); color: var(--text2);
    cursor: pointer; transition: all 0.12s; user-select: none;
  }
  .who-chip.selected { background: var(--green-bg); color: var(--green); border-color: rgba(151,196,89,0.3); }

  /* ── Search / filter ── */
  .search-wrap { position: relative; margin-bottom: 12px; }
  .search-wrap input { padding-left: 40px; }
  .search-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); font-size: 16px; color: var(--text3); pointer-events: none; }
  .filter-row { display: flex; gap: 7px; margin-bottom: 12px; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
  .filter-row::-webkit-scrollbar { display: none; }
  .chip { flex-shrink: 0; font-family: var(--mono); font-size: 11px; padding: 5px 11px; border-radius: 20px; border: 1px solid var(--border); background: none; color: var(--text3); cursor: pointer; white-space: nowrap; transition: all 0.13s; }
  .chip.active { background: var(--green-bg); color: var(--green); border-color: rgba(151,196,89,0.3); }
  .sort-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .sort-label { font-family: var(--mono); font-size: 11px; color: var(--text3); }
  .sort-sel { width: auto; padding: 5px 10px; font-size: 12px; background: var(--bg3); }

  /* ── Cards ── */
  .pcard { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; }
  .pcard-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
  .pname { font-size: 15px; font-weight: 500; }
  .pqty { font-size: 12px; color: var(--text3); font-family: var(--mono); }
  .pmeta { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .pmeta span { font-size: 12px; color: var(--text3); display: flex; align-items: center; gap: 3px; }
  .price-row { display: flex; align-items: center; justify-content: space-between; }
  .price { font-family: var(--mono); font-size: 22px; font-weight: 500; }
  .badge { display: inline-flex; align-items: center; gap: 3px; font-family: var(--mono); font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 20px; }
  .badge-up { background: var(--red-bg); color: var(--red); }
  .badge-down { background: var(--green-bg); color: var(--green); }
  .badge-same { background: var(--bg4); color: var(--text3); }
  .hist-btn { margin-top: 10px; font-size: 12px; color: var(--text3); background: none; border: none; cursor: pointer; font-family: var(--mono); padding: 0; display: flex; align-items: center; gap: 4px; }
  .hist-btn:hover { color: var(--text2); }
  .hist-panel { display: none; margin-top: 12px; border-top: 1px solid var(--border); padding-top: 10px; }
  .hist-panel.open { display: block; }
  .hrow { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .hrow:last-child { border-bottom: none; padding-bottom: 0; }
  .hinfo { color: var(--text3); font-family: var(--mono); font-size: 11px; }
  .hprice { font-family: var(--mono); font-weight: 500; }
  .hdelta { font-family: var(--mono); font-size: 11px; }
  .card-actions { display: flex; justify-content: flex-end; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
  .btn-del { font-size: 12px; color: var(--text3); background: none; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 5px 12px; cursor: pointer; font-family: var(--sans); transition: all 0.13s; }
  .btn-del:hover { color: var(--red); border-color: var(--red); }

  /* ── Empty / loading ── */
  .empty { text-align: center; padding: 48px 16px; color: var(--text3); }
  .empty-icon { font-size: 36px; margin-bottom: 10px; }
  .empty p { font-size: 15px; color: var(--text2); margin-bottom: 4px; }
  .empty small { font-size: 13px; }
  .loading { text-align: center; padding: 40px; font-family: var(--mono); font-size: 13px; color: var(--text3); }

  /* ── Stats ── */
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
  .scard { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px; }
  .scard-label { font-family: var(--mono); font-size: 11px; color: var(--text3); margin-bottom: 6px; }
  .scard-val { font-family: var(--mono); font-size: 26px; font-weight: 500; }
  .slabel { font-family: var(--mono); font-size: 11px; color: var(--text3); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 10px; }

  /* ── Alert ── */
  .alert { display: flex; align-items: flex-start; gap: 10px; border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 8px; border: 1px solid transparent; }
  .alert-up { background: var(--red-bg); border-color: rgba(226,75,74,0.2); }
  .alert-down { background: var(--green-bg); border-color: rgba(151,196,89,0.2); }
  .alert-icon { font-size: 18px; flex-shrink: 0; }
  .alert-up .alert-icon { color: var(--red); }
  .alert-down .alert-icon { color: var(--green); }
  .alert-name { font-size: 14px; font-weight: 500; margin-bottom: 2px; }
  .alert-detail { font-family: var(--mono); font-size: 11px; color: var(--text2); }

  /* ── Timeline ── */
  .tl-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .tl-item:last-child { border-bottom: none; }
  .tl-name { font-size: 14px; font-weight: 500; margin-bottom: 2px; }
  .tl-meta { font-family: var(--mono); font-size: 11px; color: var(--text3); }
  .tl-price { font-family: var(--mono); font-size: 15px; font-weight: 500; }

  /* ── Toast ── */
  .toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--text); color: var(--bg); padding: 10px 20px; border-radius: 24px; font-size: 14px; font-weight: 600; opacity: 0; transition: opacity 0.25s, transform 0.25s; pointer-events: none; white-space: nowrap; z-index: 999; font-family: var(--sans); }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── Modal ── */
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 200; align-items: flex-end; justify-content: center; }
  .overlay.open { display: flex; }
  .modal { background: var(--bg2); border: 1px solid var(--border2); border-radius: var(--radius) var(--radius) 0 0; padding: 24px 20px 36px; width: 100%; max-width: 480px; }
  .modal-title { font-size: 17px; font-weight: 600; margin-bottom: 8px; }
  .modal-body { font-size: 14px; color: var(--text2); margin-bottom: 20px; line-height: 1.5; }
  .modal-actions { display: flex; gap: 10px; }
  .modal-actions button { flex: 1; padding: 12px; border-radius: var(--radius-sm); font-size: 15px; font-weight: 600; font-family: var(--sans); cursor: pointer; border: none; }
  .m-cancel { background: var(--bg4); color: var(--text); }
  .m-confirm { background: var(--red); color: #fff; }

  /* ── Config section ── */
  .cfg-section { margin-top: 28px; border-top: 1px solid var(--border); padding-top: 20px; }
  .btn-sec { font-size: 13px; color: var(--text3); background: none; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 14px; cursor: pointer; font-family: var(--sans); transition: all 0.13s; margin-right: 8px; margin-bottom: 8px; }
  .btn-sec:hover { color: var(--text); border-color: var(--border2); }
  .btn-sec.danger:hover { color: var(--red); border-color: var(--red); }
</style>
</head>
<body>

<!-- ══ TELA DE LOGIN ══ -->
<div id="screen-login">
  <div class="login-logo">🏷️</div>
  <h1 class="login-title">Preço Certo</h1>
  <p class="login-sub">Controle de preços da família</p>
  <div class="login-box">
    <label class="login-label" for="login-code">Código de acesso</label>
    <input class="login-input" type="password" id="login-code" placeholder="••••••" autocomplete="off" inputmode="text">
    <button class="login-btn" onclick="tentarLogin()">Entrar</button>
    <div class="login-error" id="login-error"></div>
    <p class="login-hint">Apenas membros da família com o código podem acessar.</p>
  </div>
</div>

<!-- ══ APP PRINCIPAL ══ -->
<div id="screen-app">
  <div class="header">
    <div class="header-inner">
      <div class="logo">
        <div class="logo-icon">🏷️</div>
        <span class="logo-text">Preço Certo</span>
      </div>
      <div class="header-right">
        <span class="sync-dot off" id="sync-dot" title="Status de conexão"></span>
        <button class="logout-btn" onclick="sair()">sair</button>
      </div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('registrar')">＋ Registrar</button>
    <button class="tab" onclick="switchTab('produtos')">Produtos</button>
    <button class="tab" onclick="switchTab('resumo')">Resumo</button>
  </div>

  <!-- ── Registrar ── -->
  <div id="view-registrar" class="view active">
    <div class="fgroup">
      <label class="flabel">Quem está registrando</label>
      <div id="who-chips"></div>
    </div>
    <div class="fgroup">
      <label class="flabel">Nome do produto</label>
      <input type="text" id="inp-nome" placeholder="Ex: Arroz Tio João 5kg" autocomplete="off" list="dl-nomes">
      <datalist id="dl-nomes"></datalist>
    </div>
    <div class="fgroup">
      <label class="flabel">Categoria</label>
      <select id="inp-cat">
        <option value="">Selecione...</option>
        <option>Grãos e cereais</option>
        <option>Carnes e frios</option>
        <option>Laticínios</option>
        <option>Higiene e limpeza</option>
        <option>Bebidas</option>
        <option>Hortifruti</option>
        <option>Padaria</option>
        <option>Congelados</option>
        <option>Limpeza doméstica</option>
        <option>Outros</option>
      </select>
    </div>
    <div class="row2">
      <div class="fgroup">
        <label class="flabel">Preço (R$)</label>
        <input type="number" id="inp-preco" placeholder="0,00" step="0.01" min="0" inputmode="decimal">
      </div>
      <div class="fgroup">
        <label class="flabel">Quantidade</label>
        <input type="text" id="inp-qtd" placeholder="5kg, 1L...">
      </div>
    </div>
    <div class="fgroup">
      <label class="flabel">Local de compra</label>
      <input type="text" id="inp-local" placeholder="Ex: Zaffari, Bourbon" list="dl-locais">
      <datalist id="dl-locais"></datalist>
    </div>
    <div class="fgroup">
      <label class="flabel">Data</label>
      <input type="date" id="inp-data">
    </div>
    <div class="fgroup">
      <label class="flabel">Observação (opcional)</label>
      <input type="text" id="inp-obs" placeholder="promoção, marca diferente...">
    </div>
    <button class="btn-save" id="btn-salvar" onclick="salvar()">Salvar registro</button>
  </div>

  <!-- ── Produtos ── -->
  <div id="view-produtos" class="view">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="busca" placeholder="Buscar produto ou loja..." oninput="renderProdutos()">
    </div>
    <div class="filter-row" id="filtros-cat"></div>
    <div class="sort-bar">
      <span class="sort-label">ordenar por</span>
      <select class="sort-sel" id="sort-sel" onchange="renderProdutos()">
        <option value="recente">Mais recente</option>
        <option value="nome">Nome A–Z</option>
        <option value="preco-asc">Menor preço</option>
        <option value="preco-desc">Maior preço</option>
        <option value="variacao">Maior variação</option>
      </select>
    </div>
    <div id="lista-produtos"><div class="loading">Carregando...</div></div>
  </div>

  <!-- ── Resumo ── -->
  <div id="view-resumo" class="view">
    <div class="stats-grid" id="stats-grid"></div>
    <div class="slabel">alertas de variação ≥5%</div>
    <div id="alertas"></div>
    <div class="slabel" style="margin-top:20px">registros recentes</div>
    <div id="timeline"></div>
    <div class="cfg-section">
      <div class="slabel">dados</div>
      <button class="btn-sec" onclick="exportarCSV()">Exportar CSV</button>
      <button class="btn-sec danger" onclick="confirmarLimpar()">Limpar tudo</button>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="overlay" id="overlay" onclick="fecharModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title" id="m-title"></div>
    <div class="modal-body" id="m-body"></div>
    <div class="modal-actions">
      <button class="m-cancel" onclick="fecharModal()">Cancelar</button>
      <button class="m-confirm" id="m-confirm"></button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy, writeBatch, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

// ═══════════════════════════════════════════════════
//  ⚙️  CONFIGURAÇÃO — preencha com seus dados do Firebase
// ═══════════════════════════════════════════════════
const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyBUhCPysQ13B6Z0I7Rrgh3oqNpc96_ocK8",
  authDomain:        "preco-c802a.firebaseapp.com",
  projectId:         "preco-c802a",
  storageBucket:     "preco-c802a.firebasestorage.app",
  messagingSenderId: "248999752251",
  appId:             "1:248999752251:web:2532e5170264d4cf3ca21e"
};

// Código de acesso da família (pode trocar por qualquer palavra/frase)
const CODIGO_FAMILIA = "mercado2025";

// Membros da família (edite à vontade)
const MEMBROS = ["Alex", "Esposa", "Mãe", "Pai"];
// ═══════════════════════════════════════════════════

let db, colRef, unsubscribe;
let dados = [];
let membroAtual = localStorage.getItem('precoCerto_membro') || '';
let filtroCategoria = '';

// ── Login ──
document.getElementById('login-code').addEventListener('keydown', e => { if (e.key === 'Enter') tentarLogin(); });
window.tentarLogin = () => {
  const val = document.getElementById('login-code').value.trim();
  if (val === CODIGO_FAMILIA) {
    localStorage.setItem('precoCerto_auth', 'ok');
    iniciarApp();
  } else {
    document.getElementById('login-error').textContent = 'Código incorreto. Tente novamente.';
    document.getElementById('login-code').value = '';
  }
};

function verificarLogin() {
  if (localStorage.getItem('precoCerto_auth') === 'ok') {
    iniciarApp();
  }
}

function iniciarApp() {
  document.getElementById('screen-login').style.display = 'none';
  document.getElementById('screen-app').style.display = 'block';
  renderWhoChips();
  document.getElementById('inp-data').value = hoje();

  try {
    const app = initializeApp(FIREBASE_CONFIG);
    db = getFirestore(app);
    colRef = collection(db, 'registros');
    setSyncDot('syncing');

    const q = query(colRef, orderBy('ts', 'desc'));
    unsubscribe = onSnapshot(q, snap => {
      dados = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      setSyncDot('on');
      atualizarDatalist();
      if (document.getElementById('view-produtos').classList.contains('active')) renderProdutos();
      if (document.getElementById('view-resumo').classList.contains('active')) renderResumo();
    }, err => {
      console.error(err);
      setSyncDot('off');
      toast('Erro de conexão com o banco ⚠');
    });
  } catch(e) {
    setSyncDot('off');
    toast('Firebase não configurado — verifique o index.html');
  }
}

window.sair = () => {
  if (unsubscribe) unsubscribe();
  localStorage.removeItem('precoCerto_auth');
  location.reload();
};

// ── Who chips ──
function renderWhoChips() {
  document.getElementById('who-chips').innerHTML = MEMBROS.map(m =>
    `<span class="who-chip ${membroAtual === m ? 'selected' : ''}" onclick="selecionarMembro('${m}')">${m}</span>`
  ).join('');
}
window.selecionarMembro = m => {
  membroAtual = m;
  localStorage.setItem('precoCerto_membro', m);
  renderWhoChips();
};

// ── Salvar ──
window.salvar = async () => {
  const nome = document.getElementById('inp-nome').value.trim();
  const preco = parseFloat(document.getElementById('inp-preco').value);
  const local = document.getElementById('inp-local').value.trim();
  const data = document.getElementById('inp-data').value;
  const cat = document.getElementById('inp-cat').value;
  const qtd = document.getElementById('inp-qtd').value.trim();
  const obs = document.getElementById('inp-obs').value.trim();

  if (!nome) { toast('Informe o nome do produto ⚠'); return; }
  if (isNaN(preco) || preco <= 0) { toast('Preço inválido ⚠'); return; }
  if (!local) { toast('Informe o local de compra ⚠'); return; }
  if (!data) { toast('Informe a data ⚠'); return; }
  if (!db) { toast('Firebase não conectado ⚠'); return; }

  const btn = document.getElementById('btn-salvar');
  btn.disabled = true;
  btn.textContent = 'Salvando...';

  try {
    await addDoc(colRef, { nome, preco, local, data, cat, qtd, obs, quem: membroAtual, ts: Date.now() });
    toast('Registro salvo ✓');
    document.getElementById('inp-nome').value = '';
    document.getElementById('inp-preco').value = '';
    document.getElementById('inp-qtd').value = '';
    document.getElementById('inp-local').value = '';
    document.getElementById('inp-obs').value = '';
    document.getElementById('inp-cat').value = '';
    document.getElementById('inp-data').value = hoje();
  } catch(e) {
    toast('Erro ao salvar ⚠');
    console.error(e);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Salvar registro';
  }
};

// ── Delete ──
window.confirmarDeletar = nome => {
  const hist = getHist(nome);
  abrirModal(
    'Remover produto',
    `Remover "${nome}" e todos os ${hist.length} registro(s)? Não dá pra desfazer.`,
    'Remover',
    async () => {
      try {
        setSyncDot('syncing');
        for (const r of hist) await deleteDoc(doc(db, 'registros', r.id));
        toast('Produto removido');
      } catch(e) { toast('Erro ao remover ⚠'); }
    }
  );
};

// ── Limpar tudo ──
window.confirmarLimpar = () => {
  abrirModal(
    'Limpar todos os dados',
    `Apagar todos os ${dados.length} registros permanentemente?`,
    'Apagar tudo',
    async () => {
      try {
        setSyncDot('syncing');
        const snap = await getDocs(colRef);
        const batch = writeBatch(db);
        snap.forEach(d => batch.delete(d.ref));
        await batch.commit();
        toast('Dados apagados');
      } catch(e) { toast('Erro ao apagar ⚠'); }
    }
  );
};

// ── Render Produtos ──
window.renderProdutos = () => {
  const busca = document.getElementById('busca').value.toLowerCase();
  const sort = document.getElementById('sort-sel').value;

  const cats = [...new Set(dados.map(d => d.cat).filter(Boolean))];
  document.getElementById('filtros-cat').innerHTML =
    ['Todas', ...cats].map(c =>
      `<button class="chip ${(c === 'Todas' ? filtroCategoria === '' : filtroCategoria === c) ? 'active' : ''}" onclick="setFiltro('${c === 'Todas' ? '' : esc(c)}')">${esc(c)}</button>`
    ).join('');

  let nomes = [...new Set(dados.map(d => d.nome))];
  if (busca) nomes = nomes.filter(n => {
    const h = getHist(n);
    return n.toLowerCase().includes(busca) || (h[0] && h[0].local.toLowerCase().includes(busca));
  });
  if (filtroCategoria) nomes = nomes.filter(n => { const h = getHist(n); return h[0] && h[0].cat === filtroCategoria; });

  nomes.sort((a, b) => {
    const ha = getHist(a), hb = getHist(b);
    if (sort === 'nome') return a.localeCompare(b, 'pt-BR');
    if (sort === 'preco-asc') return ha[0].preco - hb[0].preco;
    if (sort === 'preco-desc') return hb[0].preco - ha[0].preco;
    if (sort === 'variacao') {
      const da = getDelta(ha), db2 = getDelta(hb);
      return Math.abs(db2 ? parseFloat(db2.pct) : 0) - Math.abs(da ? parseFloat(da.pct) : 0);
    }
    return (hb[0]?.ts || 0) - (ha[0]?.ts || 0);
  });

  const el = document.getElementById('lista-produtos');
  if (!nomes.length) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">${dados.length ? '🔍' : '🛒'}</div><p>${dados.length ? 'Nenhum produto encontrado' : 'Nenhum produto cadastrado'}</p><small>${dados.length ? 'Tente outra busca' : 'Use a aba Registrar para começar'}</small></div>`;
    return;
  }

  el.innerHTML = nomes.map(nome => {
    const hist = getHist(nome);
    const ult = hist[0];
    const delta = getDelta(hist);
    let badge = '';
    if (delta) {
      if (Math.abs(parseFloat(delta.pct)) < 0.1) badge = `<span class="badge badge-same">= ${delta.pct}%</span>`;
      else if (delta.up) badge = `<span class="badge badge-up">▲ +${delta.pct}%</span>`;
      else badge = `<span class="badge badge-down">▼ ${delta.pct}%</span>`;
    }

    const hid = 'h_' + nome.replace(/\W/g,'_');
    const histRows = hist.map((h, i) => {
      let hd = '';
      if (i < hist.length - 1) {
        const d = h.preco - hist[i+1].preco;
        const p = (d / hist[i+1].preco * 100).toFixed(1);
        hd = d > 0 ? `<span class="hdelta" style="color:var(--red)">▲ +${p}%</span>` : d < 0 ? `<span class="hdelta" style="color:var(--green)">▼ ${p}%</span>` : '';
      }
      return `<div class="hrow">
        <div><div style="font-size:13px;font-weight:500">${esc(h.local)}</div>
        <div class="hinfo">${fmtData(h.data)}${h.quem ? ' · ' + esc(h.quem) : ''}${h.obs ? ' · ' + esc(h.obs) : ''}</div></div>
        <div style="display:flex;align-items:center;gap:8px"><span class="hprice">${fmt(h.preco)}</span>${hd}</div>
      </div>`;
    }).join('');

    return `<div class="pcard">
      <div class="pcard-top">
        <div><div class="pname">${esc(nome)}</div>${ult.qtd ? `<span class="pqty">${esc(ult.qtd)}</span>` : ''}</div>
        ${badge}
      </div>
      <div class="pmeta">
        ${ult.cat ? `<span>🏷 ${esc(ult.cat)}</span>` : ''}
        <span>📍 ${esc(ult.local)}</span>
        <span>📅 ${fmtData(ult.data)}</span>
        ${ult.quem ? `<span>👤 ${esc(ult.quem)}</span>` : ''}
        ${hist.length > 1 ? `<span>🕐 ${hist.length} registros</span>` : ''}
      </div>
      <div class="price-row">
        <span class="price">${fmt(ult.preco)}</span>
        ${hist.length < 2 ? '<span style="font-size:12px;color:var(--text3);font-family:var(--mono)">1ª compra</span>' : ''}
      </div>
      ${hist.length > 1 ? `<button class="hist-btn" onclick="toggleHist('${hid}')">↕ ver histórico completo</button>
      <div class="hist-panel" id="${hid}">${histRows}</div>` : ''}
      <div class="card-actions"><button class="btn-del" onclick="confirmarDeletar('${esc(nome)}')">🗑 Remover</button></div>
    </div>`;
  }).join('');
};

window.setFiltro = cat => { filtroCategoria = cat; renderProdutos(); };
window.toggleHist = id => { const el = document.getElementById(id); if(el) el.classList.toggle('open'); };

// ── Resumo ──
function renderResumo() {
  const nUnicos = [...new Set(dados.map(d => d.nome))].length;
  const nLocais = [...new Set(dados.map(d => d.local))].length;
  const mesAtual = new Date().toISOString().slice(0,7);
  const mesCount = dados.filter(d => d.data && d.data.startsWith(mesAtual)).length;

  document.getElementById('stats-grid').innerHTML = [
    ['registros', dados.length], ['produtos', nUnicos], ['lojas', nLocais], ['este mês', mesCount]
  ].map(([l,v]) => `<div class="scard"><div class="scard-label">${l}</div><div class="scard-val">${v}</div></div>`).join('');

  const alertas = [];
  [...new Set(dados.map(d => d.nome))].forEach(nome => {
    const hist = getHist(nome); const delta = getDelta(hist);
    if (delta && Math.abs(parseFloat(delta.pct)) >= 5) alertas.push({ nome, delta, ult: hist[0] });
  });
  alertas.sort((a,b) => Math.abs(parseFloat(b.delta.pct)) - Math.abs(parseFloat(a.delta.pct)));

  document.getElementById('alertas').innerHTML = !alertas.length
    ? `<p style="font-size:13px;color:var(--text3)">Nenhuma variação significativa detectada ainda.</p>`
    : alertas.slice(0,8).map(a => `<div class="alert ${a.delta.up ? 'alert-up' : 'alert-down'}">
        <span class="alert-icon">${a.delta.up ? '📈' : '📉'}</span>
        <div><div class="alert-name">${esc(a.nome)}</div>
        <div class="alert-detail">${a.delta.up ? 'subiu' : 'caiu'} ${Math.abs(a.delta.pct)}% · agora ${fmt(a.ult.preco)} em ${esc(a.ult.local)}</div></div>
      </div>`).join('');

  document.getElementById('timeline').innerHTML = !dados.length
    ? `<p style="font-size:13px;color:var(--text3)">Nenhum registro ainda.</p>`
    : dados.slice(0,20).map(d => `<div class="tl-item">
        <div><div class="tl-name">${esc(d.nome)}</div>
        <div class="tl-meta">${esc(d.local)} · ${fmtData(d.data)}${d.quem ? ' · ' + esc(d.quem) : ''}</div></div>
        <span class="tl-price">${fmt(d.preco)}</span>
      </div>`).join('');
}

// ── Export CSV ──
window.exportarCSV = () => {
  if (!dados.length) { toast('Nenhum dado para exportar'); return; }
  const bom = '\uFEFF';
  const hdr = 'Nome,Categoria,Preco,Quantidade,Local,Data,Quem,Observacao';
  const rows = dados.map(d => [d.nome, d.cat, d.preco, d.qtd, d.local, d.data, d.quem, d.obs]
    .map(v => `"${String(v||'').replace(/"/g,'""')}"`).join(','));
  const blob = new Blob([bom + hdr + '\n' + rows.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: 'preco-certo-' + hoje() + '.csv' });
  a.click(); URL.revokeObjectURL(a.href);
  toast('CSV exportado ✓');
};

// ── Tabs ──
window.switchTab = tab => {
  ['registrar','produtos','resumo'].forEach((t, i) => {
    document.querySelectorAll('.tab')[i].classList.toggle('active', t === tab);
    document.getElementById('view-' + t).classList.toggle('active', t === tab);
  });
  if (tab === 'produtos') renderProdutos();
  if (tab === 'resumo') renderResumo();
};

// ── Modal ──
function abrirModal(titulo, corpo, btnLabel, cb) {
  document.getElementById('m-title').textContent = titulo;
  document.getElementById('m-body').textContent = corpo;
  document.getElementById('m-confirm').textContent = btnLabel;
  document.getElementById('m-confirm').onclick = () => { cb(); fecharModal(); };
  document.getElementById('overlay').classList.add('open');
}
window.fecharModal = () => document.getElementById('overlay').classList.remove('open');

// ── Toast ──
window.toast = msg => {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2600);
};

// ── Sync dot ──
function setSyncDot(state) {
  const el = document.getElementById('sync-dot');
  el.className = 'sync-dot' + (state === 'on' ? '' : state === 'off' ? ' off' : ' syncing');
}

// ── Utils ──
function fmt(v) { return parseFloat(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
function fmtData(d) { if (!d) return ''; const [y,m,dd] = d.split('-'); return `${dd}/${m}/${y}`; }
function hoje() { return new Date().toISOString().split('T')[0]; }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function getHist(nome) { return dados.filter(d => d.nome.trim().toLowerCase() === nome.trim().toLowerCase()).sort((a,b) => b.ts - a.ts); }
function getDelta(hist) {
  if (hist.length < 2) return null;
  const diff = hist[0].preco - hist[1].preco;
  return { diff, pct: (diff / hist[1].preco * 100).toFixed(1), up: diff > 0 };
}
function atualizarDatalist() {
  document.getElementById('dl-nomes').innerHTML = [...new Set(dados.map(d=>d.nome))].map(n=>`<option value="${esc(n)}">`).join('');
  document.getElementById('dl-locais').innerHTML = [...new Set(dados.map(d=>d.local))].map(l=>`<option value="${esc(l)}">`).join('');
}

verificarLogin();
</script>
